;
; platformio.custom.dev.ini — Debug / Development Environments
;
; All [env:debug_*] environments live here.
; Release environments are in platformio.custom.ini.
; Both files are loaded via extra_configs in platformio.ini.
;
; Usage:  pio run -e debug_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1
;

; ============================================================================
; Development Base Sections
; ============================================================================

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_DEBUG
  ; -D OPENKNX_DEBUGGER
  ; -D OPENKNX_RUNTIME_STAT
  ; -D OPENKNX_RUNTIME_STAT_BUCKETN=7
  ; "-D OPENKNX_RUNTIME_STAT_BUCKETS=100, 200, 500, 1000, 2000, 5000"
  ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D LOGIC_TRACE
  ; "-D OPENKNX_TRACE1=PIO NeoPixel Spi"
  ; "-D OPENKNX_TRACE1=Meter.*"
  ; "-D OPENKNX_TRACE2=Flash.*"

[custom_develop_ESP32]
extends = ESP32_develop, custom_develop
build_flags =
  ${ESP32_develop.build_flags}
  ${custom_develop.build_flags}

; ============================================================================
; Debug Environment - OpenKNXiao KNeoPix ESP32-S3 V1 (the only one; .vscode/launch.json)
; RP2040/RP2350 have no debug env: a debug build does not fit their 2 MB flash layout.
; ============================================================================

[env:debug_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1]
extends = env:release_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1
build_type = debug
build_flags =
  ${env:release_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1.build_flags}
  -D OPENKNX_DEBUG

; Isolated release-size prototype. Generate its application first:
; pwsh -NoProfile -File scripts/Build-InputTest.ps1
; GPIO41/42 are RAW XIAO pads; the KNeoPiX LED terminals cannot read buttons.
[env:inputtest_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V15_IP]
extends = env:release_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V15_IP
lib_ignore =
build_flags =
  ${env:release_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V15_IP.build_flags}
  -D NEOPIXEL_LOCAL_INPUT_TEST

; Build-only capacity checks: both OFMs are linked, runtime activation is interlocked.
; These environments deliberately do NOT assign usable input GPIOs. Never deploy them.
[env:inputsize_OKNXHW_OPENKNXIAO_ESP32C6_MINI_V1]
extends = env:release_OKNXHW_OPENKNXIAO_ESP32C6_MINI_V1
lib_ignore =
build_flags =
  ${env:release_OKNXHW_OPENKNXIAO_ESP32C6_MINI_V1.build_flags}
  -D NEOPIXEL_INPUT_SIZE_TEST

[env:inputsize_OKNXHW_UP1_GW_UART]
extends = env:release_OKNXHW_UP1_GW_UART
lib_ignore =
build_flags =
  ${env:release_OKNXHW_UP1_GW_UART.build_flags}
  -D NEOPIXEL_INPUT_SIZE_TEST

[env:inputsize_QUINLED_DIG_QUAD_V3_WIFI]
extends = env:release_QUINLED_DIG_QUAD_V3_WIFI
lib_ignore =
build_flags =
  ${env:release_QUINLED_DIG_QUAD_V3_WIFI.build_flags}
  -D NEOPIXEL_INPUT_SIZE_TEST

; ============================================================================
; End of File
; ============================================================================

